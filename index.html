<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>StudyHub</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div id="lbar" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 12.5l9 5 9-5M3 17l9 5 9-5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2zM4 20a2 2 0 0 0 2 2h14"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"/></symbol>
    <symbol id="i-contrast" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 3v18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-3.500-2-5.500-3-8-1 2-2 3-3 3 0-3-1-6-4-8 0 4-4 6-4 12 0 4 3 8 7 8z"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="M2 8.500a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.500 15.500a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
  </defs>
</svg>
<header class="top">
  <button id="burger" class="ib" aria-label="Open menu" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
  <a class="brand" href="#/">StudyHub</a>
  <span id="sync" class="sync" role="status" aria-live="polite"></span>
  <button id="srch" class="ib wide" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg><span>Search</span><kbd>Ctrl K</kbd></button>
  <button id="theme" class="ib" aria-label="Switch light and dark theme"><svg class="ic"><use href="#i-contrast"/></svg></button>
</header>
<aside id="side" aria-label="Main navigation"></aside>
<div id="scrim"></div>
<main id="app" tabindex="-1" aria-busy="true"><div class="skw" role="status" aria-label="Loading">
  <div class="sk" style="height:12px;width:96px"></div><div class="sk" style="height:34px;width:82%;margin:16px 0 10px"></div><div class="sk" style="height:34px;width:52%"></div>
  <div class="sk" style="height:176px;margin:30px 0"></div>
  <div class="grid"><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div></div></div></main>
<nav class="bottom" id="bottom" aria-label="Quick navigation"></nav>
<div id="overlay" hidden>
  <div class="panel" role="dialog" aria-label="Search"><input id="q" placeholder="Search lessons and terms" autocomplete="off"><div id="res"></div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
